name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Remove legacy_env from wrangler config
        run: |
          if command -v jq &> /dev/null; then
            jq 'del(.legacy_env)' dist/server/wrangler.json > tmp.json && mv tmp.json dist/server/wrangler.json
          elif [ -f dist/server/wrangler.json ]; then
            sed -i '/"legacy_env"/d' dist/server/wrangler.json
          fi

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy --config dist/server/wrangler.json || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
